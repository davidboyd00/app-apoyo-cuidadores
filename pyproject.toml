[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "scripts"]

[tool.ruff.lint]
# Set base: pycodestyle errors + pyflakes + isort + bugbear + comprensiones.
# No agregamos reglas de estilo agresivas para no chocar con el estilo
# del equipo. Si más adelante se quiere endurecer, se abre discusión.
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = [
  "E501",  # line-too-long: ruff format decide el largo real
  "B008",  # function-call-in-default-argument: FastAPI usa `= Depends(...)`
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # asserts en tests

[tool.ruff.format]
quote-style = "double"
