name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Tests (pytest + Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Variables estándar de libpq: psycopg las lee sin más config.
      # conftest.py lo aprovecha para conectarse al service container.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      # Valores de prueba: Settings los exige al importar la app. Ningún test
      # llama a Supabase real (las pruebas de integración usan PostgREST local).
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_ANON_KEY: test
      SUPABASE_JWT_SECRET: testsecret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Install PostgREST (pruebas de integración, EDT 5.1.1)
        run: |
          curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz \
            | sudo tar -xJ -C /usr/local/bin
          postgrest --version
      - name: pytest (unitarias, RLS, migraciones e integración)
        env:
          POSTGREST_BIN: /usr/local/bin/postgrest
        run: python -m pytest -v
